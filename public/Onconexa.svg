<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <style>
      .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 108px;
      }
      .brand-navy {
        fill: #082347;
      }
      .brand-teal {
        fill: #00baa3;
      }
      .tagline {
        fill: #5b758a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 26.5px;
        letter-spacing: 0.33em;
      }
    </style>
  </defs>

  <!-- Main Wordmark: OncoNexa -->
  <text x="35" y="125" class="wordmark">
    <tspan class="brand-navy">Onco</tspan><tspan class="brand-teal">Nexa</tspan>
  </text>

  <!-- Subtitle Tagline: PRECISION ONCOLOGY EMR -->
